name: Publish BJK prototype HTML
on:
  push:
    paths:
      - "prototype.html.gz.b64.part5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode complete approved prototype
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          src = ''.join(pathlib.Path('prototype.html.gz.b64.part'+str(i)).read_text().strip() for i in range(1,6))
          target = gzip.decompress(base64.b64decode(src))
          assert target.startswith(b'<!doctype html>'), 'Expected HTML'
          assert b'ALLE KAMPDATA, STATUSSEN EN GEBOORTEJAREN ZIJN FICTIEF' in target
          assert b'noindex, nofollow' in target
          pathlib.Path('index.html').write_bytes(target)
          PY
      - name: Publish index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish BJK clickable prototype v0.1"
          git push
